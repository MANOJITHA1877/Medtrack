<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MedTrack | Edit Equipment</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f5f8fc;
        }

        .form-card {
            max-width: 800px;
            margin: 50px auto;
            border: none;
            border-radius: 15px;
        }

        .page-title {
            color: #0d6efd;
            font-weight: 700;
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container">


        <a
            href="/dashboard"
            class="navbar-brand fw-bold">

            🏥 MedTrack

        </a>


        <div class="d-flex gap-2">

            <a
                href="/dashboard"
                class="btn btn-light">

                📊 Dashboard

            </a>


            <a
                href="/logout"
                class="btn btn-outline-light">

                Logout

            </a>

        </div>

    </div>

</nav>



<!-- ================= FORM ================= -->

<div class="container">

    <div class="card form-card shadow">

        <div class="card-body p-5">


            <div class="text-center mb-4">

                <h1 class="page-title">

                    ✏️ Edit Equipment

                </h1>

                <p class="text-muted">

                    Update hospital equipment information

                </p>

            </div>



            <form
                method="POST"
                action="/edit_equipment/{{ equipment.id }}">


                <!-- Equipment ID -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Equipment ID

                    </label>


                    <input
                        type="text"
                        class="form-control"
                        value="{{ equipment.id }}"
                        readonly>

                    <small
                        class="text-muted">

                        Equipment ID cannot be changed.

                    </small>

                </div>



                <!-- Equipment Name -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Equipment Name

                    </label>


                    <input
                        type="text"
                        name="equipment_name"
                        class="form-control"
                        value="{{ equipment.name }}"
                        required>

                </div>



                <!-- Department -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Department

                    </label>


                    <select
                        name="department"
                        class="form-select"
                        required>


                        <option value="">
                            Select Department
                        </option>


                        <option
                            value="Cardiology"
                            {% if equipment.department == "Cardiology" %}selected{% endif %}>

                            Cardiology

                        </option>


                        <option
                            value="Radiology"
                            {% if equipment.department == "Radiology" %}selected{% endif %}>

                            Radiology

                        </option>


                        <option
                            value="ICU"
                            {% if equipment.department == "ICU" %}selected{% endif %}>

                            ICU

                        </option>


                        <option
                            value="Emergency"
                            {% if equipment.department == "Emergency" %}selected{% endif %}>

                            Emergency

                        </option>


                        <option
                            value="Orthopedics"
                            {% if equipment.department == "Orthopedics" %}selected{% endif %}>

                            Orthopedics

                        </option>


                        <option
                            value="Neurology"
                            {% if equipment.department == "Neurology" %}selected{% endif %}>

                            Neurology

                        </option>


                        <option
                            value="Pediatrics"
                            {% if equipment.department == "Pediatrics" %}selected{% endif %}>

                            Pediatrics

                        </option>


                        <option
                            value="General Medicine"
                            {% if equipment.department == "General Medicine" %}selected{% endif %}>

                            General Medicine

                        </option>


                        <option
                            value="General Surgery"
                            {% if equipment.department == "General Surgery" %}selected{% endif %}>

                            General Surgery

                        </option>


                        <option
                            value="Gynecology"
                            {% if equipment.department == "Gynecology" %}selected{% endif %}>

                            Gynecology

                        </option>


                        <option
                            value="Oncology"
                            {% if equipment.department == "Oncology" %}selected{% endif %}>

                            Oncology

                        </option>


                        <option
                            value="Dermatology"
                            {% if equipment.department == "Dermatology" %}selected{% endif %}>

                            Dermatology

                        </option>


                        <option
                            value="ENT"
                            {% if equipment.department == "ENT" %}selected{% endif %}>

                            ENT

                        </option>


                        <option
                            value="Ophthalmology"
                            {% if equipment.department == "Ophthalmology" %}selected{% endif %}>

                            Ophthalmology

                        </option>


                        <option
                            value="Psychiatry"
                            {% if equipment.department == "Psychiatry" %}selected{% endif %}>

                            Psychiatry

                        </option>


                        <option
                            value="Nephrology"
                            {% if equipment.department == "Nephrology" %}selected{% endif %}>

                            Nephrology

                        </option>


                        <option
                            value="Urology"
                            {% if equipment.department == "Urology" %}selected{% endif %}>

                            Urology

                        </option>


                        <option
                            value="Gastroenterology"
                            {% if equipment.department == "Gastroenterology" %}selected{% endif %}>

                            Gastroenterology

                        </option>


                        <option
                            value="Pulmonology"
                            {% if equipment.department == "Pulmonology" %}selected{% endif %}>

                            Pulmonology

                        </option>


                        <option
                            value="Physiotherapy"
                            {% if equipment.department == "Physiotherapy" %}selected{% endif %}>

                            Physiotherapy

                        </option>


                    </select>

                </div>



                <!-- STATUS -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Equipment Status

                    </label>


                    <select
                        name="status"
                        class="form-select"
                        required>


                        <option
                            value="Available"
                            {% if equipment.status == "Available" %}selected{% endif %}>

                            Available

                        </option>


                        <option
                            value="Maintenance"
                            {% if equipment.status == "Maintenance" %}selected{% endif %}>

                            Maintenance

                        </option>


                        <option
                            value="Missing"
                            {% if equipment.status == "Missing" %}selected{% endif %}>

                            Missing

                        </option>


                    </select>

                </div>



                <!-- MAINTENANCE DATE -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Maintenance Date

                    </label>


                    <input
                        type="date"
                        name="maintenance_date"
                        class="form-control"
                        value="{{ equipment.maintenance_date or '' }}">

                </div>



                <!-- NOTES -->

                <div class="mb-4">

                    <label
                        class="form-label fw-semibold">

                        Maintenance Notes

                    </label>


                    <textarea
                        name="maintenance_notes"
                        class="form-control"
                        rows="4"
                        placeholder="Enter maintenance details">{{ equipment.maintenance_notes or '' }}</textarea>

                </div>



                <!-- BUTTONS -->

                <div
                    class="d-flex justify-content-between">


                    <a
                        href="/dashboard"
                        class="btn btn-secondary">

                        ← Cancel

                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        💾 Save Changes

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer
    class="text-center text-muted py-4">

    © 2026 MedTrack |
    Hospital Asset Tracking System

</footer>


</body>

</html>
