<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MedTrack | Add Equipment</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f5f8fc;
        }

        .form-card {
            max-width: 800px;
            margin: 50px auto;
            border: none;
            border-radius: 15px;
        }

        .page-title {
            color: #0d6efd;
            font-weight: 700;
        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container">

        <a
            href="/dashboard"
            class="navbar-brand fw-bold">

            🏥 MedTrack

        </a>


        <div class="d-flex gap-2">

            <a
                href="/dashboard"
                class="btn btn-light">

                📊 Dashboard

            </a>


            <a
                href="/logout"
                class="btn btn-outline-light">

                Logout

            </a>

        </div>

    </div>

</nav>



<!-- ================= FORM ================= -->

<div class="container">

    <div class="card form-card shadow">

        <div class="card-body p-5">


            <div class="text-center mb-4">

                <h1 class="page-title">

                    ➕ Add Equipment

                </h1>

                <p class="text-muted">

                    Add a new hospital asset to MedTrack

                </p>

            </div>


            <form
                method="POST"
                action="/equipment">


                <!-- Equipment ID -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Equipment ID

                    </label>


                    <input
                        type="text"
                        name="equipment_id"
                        class="form-control"
                        placeholder="Example: 105"
                        required>

                </div>



                <!-- Equipment Name -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Equipment Name

                    </label>


                    <input
                        type="text"
                        name="equipment_name"
                        class="form-control"
                        placeholder="Example: Wheel Chair"
                        required>

                </div>



                <!-- Department -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Department

                    </label>


                    <select
                        name="department"
                        class="form-select"
                        required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="Cardiology">
                            Cardiology
                        </option>

                        <option value="Radiology">
                            Radiology
                        </option>

                        <option value="ICU">
                            ICU
                        </option>

                        <option value="Emergency">
                            Emergency
                        </option>

                        <option value="Orthopedics">
                            Orthopedics
                        </option>

                        <option value="Neurology">
                            Neurology
                        </option>

                        <option value="Pediatrics">
                            Pediatrics
                        </option>

                        <option value="General Medicine">
                            General Medicine
                        </option>

                        <option value="General Surgery">
                            General Surgery
                        </option>

                        <option value="Gynecology">
                            Gynecology
                        </option>

                        <option value="Oncology">
                            Oncology
                        </option>

                        <option value="Dermatology">
                            Dermatology
                        </option>

                        <option value="ENT">
                            ENT
                        </option>

                        <option value="Ophthalmology">
                            Ophthalmology
                        </option>

                        <option value="Psychiatry">
                            Psychiatry
                        </option>

                        <option value="Nephrology">
                            Nephrology
                        </option>

                        <option value="Urology">
                            Urology
                        </option>

                        <option value="Gastroenterology">
                            Gastroenterology
                        </option>

                        <option value="Pulmonology">
                            Pulmonology
                        </option>

                        <option value="Physiotherapy">
                            Physiotherapy
                        </option>

                    </select>

                </div>



                <!-- Status -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Equipment Status

                    </label>


                    <select
                        name="status"
                        class="form-select"
                        required>

                        <option value="">
                            Select Status
                        </option>

                        <option value="Available">
                            Available
                        </option>

                        <option value="Maintenance">
                            Maintenance
                        </option>

                        <option value="Missing">
                            Missing
                        </option>

                    </select>

                </div>



                <!-- Maintenance Date -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold">

                        Maintenance Date

                    </label>


                    <input
                        type="date"
                        name="maintenance_date"
                        class="form-control">

                </div>



                <!-- Maintenance Notes -->

                <div class="mb-4">

                    <label
                        class="form-label fw-semibold">

                        Maintenance Notes

                    </label>


                    <textarea
                        name="maintenance_notes"
                        class="form-control"
                        rows="4"
                        placeholder="Enter maintenance details or notes"></textarea>

                </div>



                <!-- BUTTONS -->

                <div
                    class="d-flex justify-content-between">

                    <a
                        href="/dashboard"
                        class="btn btn-secondary">

                        ← Cancel

                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        ➕ Add Equipment

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer
    class="text-center text-muted py-4">

    © 2026 MedTrack |
    Hospital Asset Tracking System

</footer>


</body>

</html>
